name: Fetch & Extract Nodes

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时
  workflow_dispatch:

jobs:
  fetch_nodes:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. 安装 curl
      - name: Install utils
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      # 3. 抓取订阅
      - name: Fetch subscription links from sources.txt
        run: |
          mkdir -p tmp
          > merged_raw.txt

          while IFS= read -r url; do
            [[ -z "$url" ]] && continue
            [[ "$url" =~ ^# ]] && continue
            echo "Fetching $url"
            curl -fsS "$url" >> merged_raw.txt || echo "Failed to fetch: $url"
            echo "" >> merged_raw.txt
          done < sources.txt

          # 去重原始节点，顺序保留
          awk '!seen[$0]++' merged_raw.txt > merged_raw_uniq.txt
          mv merged_raw_uniq.txt merged_raw.txt

      # 4. 提取节点并按协议分类排序
      - name: Extract node links by type
        run: |
          sed 's/\r//g' merged_raw.txt \
          | sed '/^[[:space:]]*$/d' \
          | sed '/^#.*$/d' \
          | awk '!seen[$0]++' > nodes_temp.txt

          PROTOS=(vmess vless trojan ssr ss hysteria hy hysteria2 hy2 tuic anytls wireguard ssh)

          > nodes.txt
          for p in "${PROTOS[@]}"; do
            grep -E "^${p}://" nodes_temp.txt >> nodes.txt || true
          done

          rm -f nodes_temp.txt

      # 5. 生成 base64 文件
      - name: Generate base64 file
        run: |
          base64 -w 0 nodes.txt > nodes_base64.txt

      # 6. 节点统计（直接合并 hysteria / hy 和 hysteria2 / hy2）
      - name: Count nodes by type
        run: |
          > node_stats.txt
          total=0
          # 定义协议统计顺序
          PROTOS=(vmess vless trojan ssr ss hysteria hy hysteria2 hy2 tuic anytls wireguard ssh)
          # 初始化合并变量
          hysteria_count=0
          hysteria2_count=0
          # 遍历 nodes.txt 统计
          while IFS= read -r line; do
           # 跳过空行
           [ -z "$line" ] && continue
           case "$line" in
            hysteria://*|hy://*)
             hysteria_count=$((hysteria_count + 1))
             ;;
            hysteria2://*|hy2://*)
             hysteria2_count=$((hysteria2_count + 1))
             ;;
            vmess://*|vless://*|trojan://*|ssr://*|ss://*|tuic://*|anytls://*|wireguard://*|ssh://*)
             proto=$(echo "$line" | grep -oE '^[^:]+' )
             eval "$proto=\$(( ${proto} + 1 ))"
             ;;
           esac
          done < nodes.txt
          # 输出统计到 node_stats.txt
          for proto in "${PROTOS[@]}"; do
            case "$proto" in
             hysteria)
              count=$hysteria_count
              ;;
             hysteria2)
              count=$hysteria2_count
              ;;
             *)
              # 如果 eval 的变量不存在就置为 0
              count=$(eval "echo \${$proto:-0}")
              ;;
            esac
            echo "${proto}=${count}" >> node_stats.txt
            total=$((total + count))
          done
          echo "Total=${total}" >> node_stats.txt

      # 7. 发送统计到 Telegram
      - name: Notify Telegram
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 读取 Total
          total=$(grep '^Total=' node_stats.txt | cut -d= -f2)
          text="本次更新共 ${total} 个节点，其中"
          has_item=false
          while IFS='=' read -r key value; do
            # 跳过 Total
            [ "$key" = "Total" ] && continue
            # 跳过 0
            [ "$value" = "0" ] && continue
            text+="${key}：${value} 个，"
            has_item=true
          done < node_stats.txt
          # 如果所有类型都是 0（极端情况）
          if [ "$has_item" = false ]; then
            text="本次更新未获取到任何有效节点"
          else
            # 去掉最后一个中文逗号
            text=${text%，}
          fi
          echo "Telegram message:"
          echo "$text"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$message"

      # 8. 推送更新到仓库
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nodes.txt nodes_base64.txt merged_raw.txt node_stats.txt
          git commit -m "Update nodes: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
